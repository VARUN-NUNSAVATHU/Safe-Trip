# SafeTrip Multi-Container Orchestration
# Demonstrates Frontend, Backend, MongoDB, PostgreSQL, and Redis Integration

version: '3.8'

services:
  # SafeTrip Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safetrip-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/safetrip
      - DATABASE_URL=postgresql://safetrip_user:safetrip_pass@postgres:5432/safetrip_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=safetrip_docker_production_jwt_secret_2026
    depends_on:
      - mongo
      - postgres
      - redis

  # MongoDB Document Store
  mongo:
    image: mongo:7.0
    container_name: safetrip-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # PostgreSQL Relational Store
  postgres:
    image: postgres:16-alpine
    container_name: safetrip-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: safetrip_user
      POSTGRES_PASSWORD: safetrip_pass
      POSTGRES_DB: safetrip_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: safetrip-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  postgres_data:
  redis_data:
